<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercise 5 – Energy Visualizations (D3)</title>
  <link rel="stylesheet" href="style.css" />

  <!-- D3 v7 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    .chart-card{padding:1rem;margin:1rem 0;border:1px solid #222;border-radius:12px;background:#0d0f12}
    .chart-title{margin:0 0 .75rem 0;font-size:1.1rem}
    .chart{width:100%;min-height:260px}
    .axis text{fill:#cfd3dc;font-size:.8rem}
    .axis path,.axis line{stroke:#444}
    .legend{font-size:.85rem;fill:#cfd3dc}
    .tooltip{
      position:fixed;pointer-events:none;padding:.4rem .6rem;border:1px solid #333;border-radius:.5rem;
      background:#111;color:#fff;font-size:.8rem;opacity:0;transition:opacity .12s ease
    }
  </style>
</head>
<body class="ex5-page">
  <!-- Your existing nav stays the same -->
  <nav class="nav">
    <div class="logo"><a href="index.html"><img src="images/Power_Logo-removebg-preview.png" alt="Logo"></a></div>
    <div class="nav-links">
      <a href="index.html" class="nav-item">Home</a>
      <a href="AboutUs.html" class="nav-item">About Us</a>
      <a href="Televisions.html" class="nav-item">Televisions</a>
      <a href="Exercise5.html" class="nav-item is-active">Exercise 5</a>
      <a href="Exercise6.html" class="nav-item">Exercise 6</a>
      <a href="Exercise6_2.html" class="nav-item">Exercise 6.2</a>
    </div>
  </nav>

  <main class="container" style="max-width:1100px;margin:0 auto;padding:1rem;">
    <h1>Exercise 5 – Energy Visualizations (D3.js)</h1>

    <section class="chart-card">
      <h2 class="chart-title">Line — Spot Power Prices (1998–2024)</h2>
      <div id="ex5_line" class="chart"></div>
    </section>

    <section class="chart-card">
      <h2 class="chart-title">Bar — 55″ Mean Energy by Screen Tech</h2>
      <div id="ex5_bar55" class="chart"></div>
    </section>

    <section class="chart-card">
      <h2 class="chart-title">Donut — Energy Share by Screen Tech</h2>
      <div id="ex5_donut" class="chart"></div>
    </section>

    <section class="chart-card">
      <h2 class="chart-title">Scatter — TV Energy vs. Screen Size</h2>
      <div id="ex5_scatter" class="chart"></div>
    </section>
  </main>

  <div id="tooltip" class="tooltip"></div>

  <!-- D3 helpers + charts (as ES modules) -->
  <script type="module" src="Exercise5_js/ex5-utils.js"></script>
  <script type="module" src="Exercise5_js/ex5-line.js"></script>
  <script type="module" src="Exercise5_js/ex5-bar55.js"></script>
  <script type="module" src="Exercise5_js/ex5-donut.js"></script>
  <script type="module" src="Exercise5_js/ex5-scatter.js"></script>

  <script src="navScript.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

</body>
</html>
